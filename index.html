<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توقع أسعار العقارات | المهندس يوسف خالد مدين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
        }

        /* Glassmorphism Effect */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Input Animations */
        .input-field {
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.6);
        }
        .input-field:focus {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            border-color: #6366f1;
        }

        /* Button Hover */
        .predict-btn {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .predict-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.5);
        }
    </style>
</head>
<body class="text-white flex items-center justify-center p-6">

    <div class="glass-panel w-full max-w-4xl rounded-3xl p-8 md:p-12 relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black mb-3 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
                نموذج الذكاء الاصطناعي لتوقع أسعار العقارات
            </h1>
            <p class="text-gray-400 text-lg">تطوير وتدريب: المهندس يوسف خالد مدين</p>
        </div>

        <!-- Form Area -->
        <form id="predictionForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Bedrooms -->
            <div class="flex flex-col">
                <label class="mb-2 text-sm text-gray-300 font-medium"><i class="fa-solid fa-bed ml-2 text-indigo-400"></i>عدد الغرف</label>
                <input type="number" id="bedrooms" class="input-field rounded-xl p-4 text-white border border-gray-700 outline-none" placeholder="مثال: 3" required>
            </div>

            <!-- Bathrooms -->
            <div class="flex flex-col">
                <label class="mb-2 text-sm text-gray-300 font-medium"><i class="fa-solid fa-bath ml-2 text-indigo-400"></i>عدد الحمامات</label>
                <input type="number" step="0.25" id="bathrooms" class="input-field rounded-xl p-4 text-white border border-gray-700 outline-none" placeholder="مثال: 2" required>
            </div>

            <!-- Sqft Living -->
            <div class="flex flex-col">
                <label class="mb-2 text-sm text-gray-300 font-medium"><i class="fa-solid fa-expand ml-2 text-indigo-400"></i>مساحة المعيشة (قدم مربع)</label>
                <input type="number" id="sqft_living" class="input-field rounded-xl p-4 text-white border border-gray-700 outline-none" placeholder="مثال: 1180" required>
            </div>

            <!-- Floors -->
            <div class="flex flex-col">
                <label class="mb-2 text-sm text-gray-300 font-medium"><i class="fa-solid fa-layer-group ml-2 text-indigo-400"></i>عدد الطوابق</label>
                <input type="number" step="0.5" id="floors" class="input-field rounded-xl p-4 text-white border border-gray-700 outline-none" placeholder="مثال: 1" required>
            </div>

            <!-- Year Built -->
            <div class="flex flex-col">
                <label class="mb-2 text-sm text-gray-300 font-medium"><i class="fa-solid fa-calendar-alt ml-2 text-indigo-400"></i>سنة البناء</label>
                <input type="number" id="yr_built" class="input-field rounded-xl p-4 text-white border border-gray-700 outline-none" placeholder="مثال: 1995" required>
            </div>

            <!-- Grade -->
            <div class="flex flex-col">
                <label class="mb-2 text-sm text-gray-300 font-medium"><i class="fa-solid fa-star ml-2 text-indigo-400"></i>تقييم العقار (Grade)</label>
                <input type="number" id="grade" class="input-field rounded-xl p-4 text-white border border-gray-700 outline-none" placeholder="من 1 إلى 13" required>
            </div>

            <!-- Submit Button -->
            <div class="md:col-span-2 mt-6">
                <button type="submit" class="predict-btn w-full py-4 rounded-xl text-xl font-bold text-white shadow-lg flex justify-center items-center gap-3">
                    <i class="fa-solid fa-robot"></i> احسب السعر المتوقع
                </button>
            </div>
        </form>

        <!-- Result Area -->
        <div id="resultArea" class="hidden mt-10 p-6 rounded-2xl bg-indigo-900/30 border border-indigo-500/30 text-center transition-all duration-500">
            <h3 class="text-gray-300 text-lg mb-2">السعر المتوقع للعقار:</h3>
            <p class="text-4xl font-black text-green-400" id="predictedPrice">$0.00</p>
            <p class="text-sm text-gray-400 mt-3">مدعوم بنموذج Machine Learning (XGBoost / Random Forest)</p>
        </div>

    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // محاكاة لعملية التوقع (هنا يمكنك لاحقاً ربطها بـ API الخاصة بالنموذج في Python)
            const resultArea = document.getElementById('resultArea');
            const priceText = document.getElementById('predictedPrice');
            
            // حركة تحميل بسيطة
            priceText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري الحساب...';
            resultArea.classList.remove('hidden');

            setTimeout(() => {
                // قيمة عشوائية استرشادية بناءً على المدخلات
                const sqft = document.getElementById('sqft_living').value || 1000;
                const basePrice = sqft * 250; // حسبة وهمية للواجهة
                
                // تنسيق الرقم
                const formattedPrice = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(basePrice);
                
                priceText.innerHTML = formattedPrice;
            }, 1500);
        });
    </script>
</body>
</html>
